name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run lint (if present)
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No root lint script found; skipping."
          fi

      - name: Run tests (if present)
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm run test
          elif node -e "const p=require('./server/package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test --prefix server
          elif node -e "const p=require('./client/package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            npm test --prefix client
          else
            echo "No test script found; skipping."
          fi

      - name: Run build (if present)
        shell: bash
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build
          elif node -e "const p=require('./client/package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            npm run build --prefix client
          else
            echo "No build script found; skipping."
          fi
